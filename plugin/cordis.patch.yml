# dsh-balance-pocket bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published package: when the
# plugin is installed through the official CLI
#
#   dsh plugin --profile <name> add dsh-balance-pocket@<version>
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-balance-pocket` to the bundle stack.
# Profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual mount line would.
#
# If the profile still carries a manual mount line for this plugin, remove it
# before switching to the bundle channel to avoid double-mounting (two Host
# halves, two snapshot routes → "duplicate prefix route" at boot).
#
# Aggregate double-mount guard: an aggregate bundle may already mount this
# package under its own entry id. Two mounts register the snapshot route twice
# and fail the whole plugin tree at boot. The `!!js` disabled expression backs
# THIS row off when another *enabled* entry already mounts
# `dsh-balance-pocket`; the aggregate instance then owns the route. The loader
# evaluates the expression when this row is processed, so only entries before
# this one are visible — the standard install order (new bundles are appended
# last) satisfies that.
- insert:
    - id: dsh-balance-pocket
      name: dsh-balance-pocket
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-balance-pocket' && e.options.id !== 'dsh-balance-pocket' && !e.disabled)"
