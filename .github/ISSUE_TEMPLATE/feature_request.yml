name: Feature request
description: 提一个功能或改进建议 / Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有的 Issue 和 README 的「已知限制」，避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem
      description: 现在哪里不方便？为什么需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的方案 / Proposed solution
      description: 你希望插件怎么表现？如果有界面草图或参考也可以贴。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives
  - type: checkboxes
    id: scope
    attributes:
      label: 范围 / Scope
      options:
        - label: 这个功能涉及 Host 端（余额来源/路由/账本）
        - label: 这个功能涉及客户端界面（侧栏/弹窗/设置）
        - label: 这个功能只涉及文档或构建
