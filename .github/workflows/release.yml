name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run self-check before releasing
        run: node check.mjs

      - name: Pack the DSH plugin
        run: |
          mkdir -p dist
          cd plugin
          npm pack --pack-destination ../dist
          cd ..
          sha256sum dist/*.tgz > dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
