name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run self-check before releasing
        run: node check.mjs

      - name: Verify the tag matches the package version
        run: |
          pkg_version="$(node -p "require('./plugin/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          source_version="$(node -p "require('node:fs').readFileSync('./plugin/index.js','utf8').match(/const VERSION = '([^']+)'/)[1]")"
          if [ "$pkg_version" != "$root_version" ] || [ "$pkg_version" != "$source_version" ]; then
            echo "Version mismatch: plugin=$pkg_version root=$root_version index.js=$source_version" >&2
            exit 1
          fi
          if [ "v$pkg_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v$pkg_version" >&2
            exit 1
          fi

      - name: Pack the DSH plugin
        run: |
          mkdir -p dist
          (cd plugin && npm pack --pack-destination ../dist)
          # Record bare filenames so `sha256sum -c` works from the download
          # directory, without the build-time dist/ prefix.
          (cd dist && sha256sum *.tgz > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
